name: Fırsat taraması

on:
  schedule:
    # Her 3 günde bir, İstanbul saatiyle 09:00 (06:00 UTC)
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      no_ai:
        description: "AI taraması olmadan çalıştır (sadece tarih + link kontrolü)"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Secret'lar eklenip Actions değişkeni REFRESH_ENABLED=true yapılana kadar çalışmaz (boşuna hata vermesin).
    if: vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run refresh -- ${{ inputs.no_ai && '--no-ai' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_GROUPS: ${{ vars.AI_GROUPS }}
